---
plugins:
  - sleeping_king_studios/docs/jekyll/plugins/required
collections:
  classes:
    output: false
  constants:
    output: false
  methods:
    output: false
  modules:
    output: false
  namespaces:
    output: false
  versions:
    output: false
defaults:
- scope:
    path: ''
    type: 'pages'
  values:
    encoding: 'utf-8'
    layout: 'page'
    title: 'Plumbum'
exclude:
  - /vendor
markdown: kramdown

# Project Configuration
project_metadata:
  description: |
    A minimal dependency injection framework for Ruby, using vanilla Ruby
    semantics to define and reference dependencies from different providers.
  name:           Plumbum
  repository_url: https://github.com/sleepingkingstudios/plumbum

# Theme Configuration
theme: jekyll-theme-dinky
description: |
  A minimal dependency injection framework for Ruby, using vanilla Ruby
  semantics to define and reference dependencies from different providers.
github:
  repository_url: https://github.com/sleepingkingstudios/plumbum
title: Plumbum
