---
name: Plumbum::Dependencies::FileSystem#remove_directory
parent_path: plumbum/dependencies/file-system
signature: 'remove_directory(def delete_directory(path, force: false, recursive: false)'
slug: remove-directory
constructor: false
data_path: plumbum/dependencies/file-system/i-remove-directory
description: |-
  Fails if the directory contains any files or child directories. The
  :recursive option enables removing empty child or descendent directories,
  while the :force option enables removing both files and directories.
params:
- description: the path to the directory.
  name: path
  type:
  - name: String
- description: if true, removes nested files and directories.
  name: force
  type:
  - name: 'true'
  - name: 'false'
  default: 'false'
- description: if true, removes nested empty directories.
  name: recursive
  type:
  - name: 'true'
  - name: 'false'
  default: 'false'
returns:
- description: the path to the removed directory.
  type:
  - name: String
short_description: Removes the directory at the requested path.
version: "*"
checksum: ZuQQbsuyDDvDNl2y7N/PiA==
